<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | GoatFarm</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
</head>

<body class="auth-page">

    <div class="auth-toggles">
        <button class="rtl-toggle theme-toggle" title="Toggle RTL">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3 4 7l4 4"></path>
                <path d="M4 7h16"></path>
                <path d="m16 21 4-4-4-4"></path>
                <path d="M20 17H4"></path>
            </svg>
        </button>
        <button class="theme-toggle" title="Toggle Theme">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </div>

    <div class="auth-card animate-up" style="position: relative;">
        <a href="index.html" class="auth-logo"
            style="display: flex; justify-content: center; align-items: center; margin-bottom: 30px; width: 100%;">
            <img src="assets/images/logo.svg" alt="GoatFarm">
        </a>

        <h3 style="margin-bottom: 30px;">Join the Herd! 🐐</h3>

        <form action="dashboard.html" method="GET" style="display: flex; flex-direction: column; align-items: center;">
            <div class="form-group" style="width: 100%;">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-input" placeholder="Enter your full name" required>
            </div>

            <div class="form-group" style="width: 100%;">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" placeholder="Enter your email" required>
            </div>

            <div class="form-group" style="width: 100%;">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" placeholder="Create a password" required>
            </div>

            <div class="form-group" style="width: 100%;">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-input" placeholder="Confirm your password" required>
            </div>

            <div class="form-group checkbox-group" style="width: 100%; text-align: left;">
                <input type="checkbox" id="terms" required>
                <label for="terms" style="font-size: 0.9rem;">I accept the <a href="#"
                        style="color: var(--primary); font-weight: 500;">Terms & Conditions</a></label>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Register</button>
        </form>

        <div class="auth-divider">OR</div>

        <button class="social-btn google-btn">
            <span style="font-size: 1.25rem;">G</span> Continue with Google
        </button>

        <button class="social-btn apple-btn">
            <svg viewBox="0 0 384 512" width="18" height="18" fill="currentColor">
                <path
                    d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z" />
            </svg> Continue with Apple
        </button>



        <div style="margin-top: 30px; font-size: 0.95rem;">
            Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600;">Login</a>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>

</html>
